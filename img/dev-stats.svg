<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a20"/>
      <stop offset="55%" stop-color="#16262d"/>
      <stop offset="100%" stop-color="#20404c"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#132029"/>
      <stop offset="100%" stop-color="#1a2e36"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- outer card -->
  <rect x="10" y="10" width="800" height="340" rx="16" fill="url(#bg)" stroke="#2c5364" stroke-opacity="0.5" stroke-width="1" filter="url(#softShadow)"/>

  <!-- title bar -->
  <path d="M10 26 a16 16 0 0 1 16 -16 h748 a16 16 0 0 1 16 16 v28 h-780 z" fill="url(#titlebar)"/>
  <circle cx="34" cy="40" r="5.5" fill="#e8b04b"/>
  <circle cx="52" cy="40" r="5.5" fill="#5f8a96" opacity="0.7"/>
  <circle cx="70" cy="40" r="5.5" fill="#5f8a96" opacity="0.4"/>
  <text x="410" y="45" text-anchor="middle" fill="#7d98a1" font-size="12.5" letter-spacing="0.5">peter@softuni:~</text>
  <line x1="10" y1="54" x2="790" y2="54" stroke="#2c5364" stroke-opacity="0.4" stroke-width="1"/>

  <!-- body -->
  <g font-size="14.5">
    <text x="34" y="86"><tspan fill="#e8b04b" font-weight="bold">$ </tspan><tspan fill="#eef3f5">whoami</tspan></text>
    <text x="34" y="110" fill="#c3d4d9">peter-monev <tspan fill="#5f8a96">·</tspan> full-stack web developer</text>

    <text x="34" y="148"><tspan fill="#e8b04b" font-weight="bold">$ </tspan><tspan fill="#eef3f5">git log --oneline journey</tspan></text>
    <text x="34" y="172" fill="#c3d4d9"><tspan fill="#e8b04b">2022</tspan>  init: joined SoftUni <tspan fill="#5f8a96">·</tspan> JavaScript track</text>
    <text x="34" y="194" fill="#c3d4d9"><tspan fill="#e8b04b">2023</tspan>  feat: 1.5y @ Megaparts <tspan fill="#5f8a96">·</tspan> PHP &amp; production systems</text>
    <text x="34" y="216" fill="#c3d4d9"><tspan fill="#e8b04b">2025</tspan>  refactor: back to SoftUni <tspan fill="#5f8a96">·</tspan> C# / .NET</text>

    <text x="34" y="254"><tspan fill="#e8b04b" font-weight="bold">$ </tspan><tspan fill="#eef3f5">ls certificates/ | wc -l</tspan></text>
    <text x="34" y="278" fill="#eef3f5" font-size="16" font-weight="bold">14</text>

    <text x="34" y="316"><tspan fill="#e8b04b" font-weight="bold">$ </tspan><tspan fill="#eef3f5">echo $STATUS</tspan></text>
    <text x="34" y="340" fill="#c3d4d9">open to new opportunities <tspan fill="#e8b04b">_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
